<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Kelime oyunu arka planı">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="50%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stage">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="180" rx="250" ry="150" fill="url(#centerGlow)"/>
  <g opacity="0.15" filter="url(#blur)">
    <circle cx="120" cy="100" r="70" fill="#BBDEFB"/>
    <circle cx="680" cy="120" r="80" fill="#C8E6C9"/>
  </g>
  <g opacity="0.1">
    <circle cx="250" cy="300" r="10" fill="#FFFFFF"/>
    <circle cx="500" cy="280" r="12" fill="#FFFFFF"/>
  </g>
  <g fill="white" opacity="0.5">
    <circle cx="200" cy="80" r="2"/>
    <circle cx="400" cy="60" r="2"/>
    <circle cx="600" cy="90" r="2"/>
  </g>
  <ellipse cx="400" cy="320" rx="240" ry="70" fill="url(#stage)" opacity="0.85"/>
</svg>
