<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Moon">
  <defs>
    <radialGradient id="moonGlow" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#fffbe9"/>
      <stop offset="38%" stop-color="#f6e6b8"/>
      <stop offset="72%" stop-color="#d5bf88"/>
      <stop offset="100%" stop-color="#b39a66"/>
    </radialGradient>
    <radialGradient id="moonShadow" cx="70%" cy="68%" r="54%">
      <stop offset="0%" stop-color="#c7b17f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9f8756" stop-opacity="0.36"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="110" fill="url(#moonGlow)"/>
  <circle cx="128" cy="128" r="110" fill="url(#moonShadow)"/>

  <g fill="#d7c08b" opacity="0.46">
    <circle cx="164" cy="70" r="16"/>
    <circle cx="84" cy="94" r="14"/>
    <circle cx="182" cy="132" r="12"/>
    <circle cx="108" cy="164" r="18"/>
    <circle cx="64" cy="140" r="10"/>
  </g>

  <g fill="#f7edd0" opacity="0.34" filter="url(#soften)">
    <circle cx="96" cy="80" r="24"/>
    <circle cx="152" cy="170" r="18"/>
    <circle cx="180" cy="104" r="14"/>
  </g>

  <circle cx="92" cy="86" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>
</svg>
