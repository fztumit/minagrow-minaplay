<!doctype html>
<html lang="tr">
<meta charset="utf-8" />
<title>Pofi Emoji Pack Preview</title>
<style>
  body { margin: 0; background: #fbfdff; font-family: system-ui, sans-serif; }
  .grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 24px; padding: 24px; }
  .card { background: white; border-radius: 24px; box-shadow: 0 12px 30px rgba(185,200,230,.18); padding: 16px; text-align:center; }
  .label { font-weight: 700; color: #4c5564; margin: 0 0 12px; font-size: 22px; }
  .stage { position: relative; width: 320px; height: 320px; margin: 0 auto; }
  .stage img, .stage object { position:absolute; inset:0; width:100%; height:100%; }
</style>
<body>
  <div class="grid">
    <div class="card"><div class="label">Idle</div><div class="stage"><img src="body.png"><img src="face-idle.svg"></div></div>
    <div class="card"><div class="label">Surprised</div><div class="stage"><img src="body.png"><img src="face-surprised.svg"></div></div>
    <div class="card"><div class="label">Calm</div><div class="stage"><img src="body.png"><img src="face-calm.svg"></div></div>
    <div class="card"><div class="label">Happy</div><div class="stage"><img src="body.png"><img src="face-happy.svg"></div></div>
    <div class="card"><div class="label">Sleep</div><div class="stage"><img src="body.png"><img src="face-sleep.svg"></div></div>
    <div class="card"><div class="label">Hide</div><div class="stage"><img src="body.png"><img src="face-idle.svg"><img src="hands-hide.svg"></div></div>
  </div>
</body>
</html>
