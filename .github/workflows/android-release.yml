name: Android Stable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MinaPlay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MinaPlay/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify release tag
        if: github.event_name == 'push'
        run: node scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Read release identity
        id: release
        run: node -e "const r=require('./release.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + r.version + '\n')"

      - name: Run quality gates
        run: |
          npm run build
          npm run lint
          npm test
          npm run test:e2e

      - name: Restore release keystore
        env:
          MINAPLAY_KEYSTORE_BASE64: ${{ secrets.MINAPLAY_KEYSTORE_BASE64 }}
        run: |
          test -n "${MINAPLAY_KEYSTORE_BASE64}"
          printf '%s' "${MINAPLAY_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/minaplay-release.jks"

      - name: Sync Android application
        run: npm run app:sync

      - name: Build signed release APK
        env:
          MINAPLAY_KEYSTORE_PATH: ${{ runner.temp }}/minaplay-release.jks
          MINAPLAY_KEYSTORE_PASSWORD: ${{ secrets.MINAPLAY_KEYSTORE_PASSWORD }}
          MINAPLAY_KEY_ALIAS: ${{ secrets.MINAPLAY_KEY_ALIAS }}
          MINAPLAY_KEY_PASSWORD: ${{ secrets.MINAPLAY_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease

      - name: Create and verify release bundle
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/create-release-bundle.mjs android/app/build/outputs/apk/release/app-release.apk release-output
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "release-output/minaplay-v${RELEASE_VERSION}.apk"
          cd release-output
          sha256sum --check "minaplay-v${RELEASE_VERSION}.apk.sha256"

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minaplay-v${{ steps.release.outputs.version }}
          path: MinaPlay/release-output/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-output/minaplay-v${RELEASE_VERSION}.apk" \
            "release-output/minaplay-v${RELEASE_VERSION}.apk.sha256" \
            release-output/minaplay-release.json \
            --verify-tag \
            --title "MinaPlay ${GITHUB_REF_NAME}" \
            --generate-notes
