<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinaPlay Offline</title>
    <style>
      :root {
        color: #4d3670;
        background: #fff7ef;
        font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 520px);
        padding: clamp(28px, 7vw, 52px);
        text-align: center;
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 32px;
        box-shadow: 0 22px 54px rgba(76, 60, 96, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 8vw, 3rem);
      }

      p {
        margin: 0;
        color: #756982;
        font-size: 1.05rem;
        font-weight: 800;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 24px;
        padding: 12px 18px;
        color: #4d3670;
        font-weight: 900;
        text-decoration: none;
        background: #dff6de;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MinaPlay hazır</h1>
      <p>İnternet şu an yok gibi görünüyor. Daha önce açılan MinaPlay yüzeyi cihazdan çalışmaya devam edebilir.</p>
      <a href="/">Ana ekrana dön</a>
    </main>
  </body>
</html>
